<head>
<meta charset="utf-8">

<meta name="color-scheme" content="dark">
<title>Moon phases · dark sky</title>
<style>
  :root { --moon: #ece7d4; color: #d5dbea; background: #0f1a34; font-family: system-ui, sans-serif; }
  * { box-sizing: border-box; }
  body { margin: 0; }
  main { max-width: 1200px; margin: auto; padding: 48px 28px; }
  .eyebrow { margin: 0 0 12px; color: #5fc2ad; font-size: 12px; letter-spacing: .18em; text-transform: uppercase; }
  h1 { margin: 0; color: var(--moon); font: 400 clamp(34px, 5vw, 52px)/1.15 Georgia, serif; }
  .intro { max-width: 620px; margin: 16px 0 24px; color: #a6b0c9; line-height: 1.6; }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 28px; }
  button { border: 1px solid #3a4a68; border-radius: 24px; padding: 10px 18px; background: transparent; color: #b6c0d5; font: inherit; font-size: 13px; cursor: pointer; }
  button[aria-pressed="true"] { color: #91ddc9; background: #153c40; border-color: #5fc2ad; }
  button:focus-visible { outline: 2px solid var(--moon); outline-offset: 4px; }
  .phases { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
  article { background: #121f3a; border: 1px solid #2a3856; border-radius: 18px; padding: 22px 14px; text-align: center; }
  article svg { display: block; width: min(100%, 204px); height: auto; margin: 0 auto 18px; }
  h2 { margin: 0 0 6px; font: 400 20px/1.3 Georgia, serif; color: var(--moon); }
  article p { margin: 0; font-size: 12px; color: #98a6c2; }
  footer { margin-top: 24px; color: #98a6c2; font-size: 12px; line-height: 1.6; }
  @media (max-width: 700px) { main { padding: 28px 16px; } .phases { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; } h2 { font-size: 18px; } }
  @media (max-width: 350px) { .phases { grid-template-columns: 1fr; } }
</style>

<main>
  <p class="eyebrow">dark sky · surface study</p>
  <h1>A month of moonlight</h1>
  <p class="intro">The Moon's dark plains, bright highlands, and crater rays across eight phases.</p>
  <div class="controls" role="group" aria-label="Viewing hemisphere">
    <button type="button" data-hemi="N" aria-pressed="true">Northern hemisphere</button>
    <button type="button" data-hemi="S" aria-pressed="false">Southern hemisphere</button>
  </div>
  <section class="phases" aria-label="Eight moon phases"></section>

// Snapshot of the site's moon renderer; this preview works entirely offline.
function moonPath(p, cx, cy, r, hemi) {
  const waxing = p < 0.5;
  const rx = Math.abs(r * Math.cos(2 * Math.PI * p));
  let outerSweep = waxing ? 1 : 0;
  let termSweep = (p < 0.25 || p >= 0.75) ? (waxing ? 0 : 1) : (waxing ? 1 : 0);
  if (hemi === 'S') { outerSweep ^= 1; termSweep ^= 1; }
  return `M ${cx} ${cy - r} A ${r} ${r} 0 0 ${outerSweep} ${cx} ${cy + r} A ${rx} ${r} 0 0 ${termSweep} ${cx} ${cy - r} Z`;
}

let moonDrawingId = 0;

function moonSvg(p, size, hemi, texture = MOON_TEXTURE) {
  // Each inline moon needs its own paint/clip IDs, including after re-renders.
  const id = `moon-${++moonDrawingId}`;
  const lit = moonPath(p, 50, 50, 48, hemi);
  return `<svg viewBox="0 0 100 100" width="${size}" height="${size}" aria-hidden="true">
    <defs>
      <clipPath id="${id}-disc"><circle cx="50" cy="50" r="48"/></clipPath>
      <filter id="${id}-soft"><feGaussianBlur stdDeviation=".3"/></filter>
      <mask id="${id}-lit" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
        <path d="${lit}" fill="white" filter="url(#${id}-soft)"/>
      </mask>
    </defs>
    <circle cx="50" cy="50" r="48" fill="#0a1226" stroke="#33405c" stroke-width=".4"/>
    ${nearNew(p) ? '' : `<g clip-path="url(#${id}-disc)" mask="url(#${id}-lit)">
      <!-- The source disc spans roughly pixels 74–950 of a 1024px square.
           A slight inset crops out its black background at the uneven limb. -->
      <image href="${texture}" x="-6.367" y="-6.367" width="112.734" height="112.734"
        transform="rotate(${hemi === 'S' ? 180 : 0} 50 50)"/>
    </g>`}
  </svg>`;
}

const phases = [
  ['New moon', 0], ['Waxing crescent', .125], ['First quarter', .25],
  ['Waxing gibbous', .375], ['Full moon', .5], ['Waning gibbous', .625],
  ['Last quarter', .75], ['Waning crescent', .875],
];
function renderPreview(hemi) {
  document.querySelector('.phases').innerHTML = phases.map(([label, p]) => {
    const illumination = Math.round((1 - Math.cos(2 * Math.PI * p)) / 2 * 100);
    return `<article>${moonSvg(p, 204, hemi)}<h2>${label}</h2><p>${illumination}% illuminated</p></article>`;
  }).join('');
  document.querySelectorAll('[data-hemi]').forEach(button => {
    button.setAttribute('aria-pressed', String(button.dataset.hemi === hemi));
  });
}
document.querySelectorAll('[data-hemi]').forEach(button => {
  button.addEventListener('click', () => renderPreview(button.dataset.hemi));
});
renderPreview('N');
</script>
