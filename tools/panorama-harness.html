<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>panorama harness</title>
<meta name="color-scheme" content="dark">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,300..600,50&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* the page's own palette, copied so the harness judges the drawing in the
     light it will actually be seen in */
  :root {
    --night: #0f1a34;
    --night-2: #17254a;
    --night-3: #22335f;
    --line: #5f74ad;
    --ink: #d5dbea;
    --ink-dim: #8b96b3;
    --moon: #ece7d4;
    --moon-dim: #a9a58f;
    --dark-sky: #5fc2ad;
    --today: #f0c36b;
    --serif: "Fraunces", Georgia, serif;
    --sans: "IBM Plex Sans", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--night); color: var(--ink); font-family: var(--sans); padding: 28px clamp(16px, 4vw, 44px) 64px; }
  h1 { font-family: var(--serif); font-weight: 300; font-size: 30px; margin: 0 0 6px; }
  h2 { font-family: var(--serif); font-weight: 400; font-size: 19px; color: var(--moon); margin: 34px 0 10px; }
  .wrap { max-width: 1100px; margin: 0 auto; }
  .lede { color: var(--ink-dim); font-size: 14px; margin: 0 0 4px; }
  .check { font-size: 13px; margin: 14px 0; padding: 10px 14px; border-radius: 10px; background: var(--night-2); border-left: 2px solid var(--dark-sky); white-space: pre-wrap; line-height: 1.6; }
  .check.bad { border-left-color: #e07a7a; }
  canvas { display: block; width: 100%; border-radius: 12px; background: var(--night-2); }
  .pano { height: 300px; }
  .summary { font-size: 13px; color: var(--ink-dim); line-height: 1.5; margin: 10px 2px 0; }
  .summary b { color: var(--moon); font-weight: 500; }
  .phone { width: 400px; max-width: 100%; }
  .phone canvas { height: 190px; }
  .spot { background: var(--night-2); border-radius: 10px; padding: 12px 14px; max-width: 420px; margin-bottom: 10px; }
  .spot .top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
  .spot .name { font-size: 16px; }
  .spot .dist { color: var(--ink-dim); font-size: 13px; }
  .spot canvas { height: 60px; margin-top: 9px; border-radius: 6px; background: transparent; }
  .spot .note { color: var(--ink-dim); font-size: 13px; line-height: 1.45; margin-top: 7px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>panorama harness</h1>
  <p class="lede">stubbed Sky and STARS, an invented ridgeline. nothing here is real data.</p>
  <div class="check" id="check">running checks</div>

  <h2>open panorama, 9pm, facing north</h2>
  <canvas class="pano" id="pano-9"></canvas>
  <p class="summary" id="sum-9"></p>

  <h2>open panorama, 1am</h2>
  <canvas class="pano" id="pano-1"></canvas>
  <p class="summary" id="sum-1"></p>

  <h2>at phone width</h2>
  <div class="phone">
    <canvas id="pano-phone"></canvas>
    <p class="summary" id="sum-phone"></p>
  </div>

  <h2>card thumbnails</h2>
  <div id="cards"></div>
</div>

<script>
// ============================================================================
// STUBS. tools/sky-astro.js and tools/stars.js replace everything in this
// block. good enough to look right, not good enough to plan a night by.
// ============================================================================
const D = Math.PI / 180, RD = 180 / Math.PI;
const norm360 = x => ((x % 360) + 360) % 360;

const Sky = {
  julianDay(date) { return date.getTime() / 86400000 + 2440587.5; },

  lmst(jd, lonDeg) {
    const T = (jd - 2451545) / 36525;
    const th = 280.46061837 + 360.98564736629 * (jd - 2451545) + 0.000387933 * T * T;
    return norm360(th + lonDeg);
  },

  sunPosition(jd) {
    const T = (jd - 2451545) / 36525;
    const L0 = 280.46646 + 36000.76983 * T;
    const M = (357.52911 + 35999.05029 * T) * D;
    const C = 1.914602 * Math.sin(M) + 0.019993 * Math.sin(2 * M) + 0.000289 * Math.sin(3 * M);
    const lon = (L0 + C) * D;
    const eps = (23.439291 - 0.0130042 * T) * D;
    return {
      ra: norm360(Math.atan2(Math.cos(eps) * Math.sin(lon), Math.cos(lon)) * RD),
      dec: Math.asin(Math.sin(eps) * Math.sin(lon)) * RD,
      distKm: 149598000
    };
  },

  moonPosition(jd) {
    const T = (jd - 2451545) / 36525;
    const Lp = 218.3164477 + 481267.88123421 * T;
    const Dm = (297.8501921 + 445267.1114034 * T) * D;
    const M = (357.5291092 + 35999.0502909 * T) * D;
    const Mp = (134.9633964 + 477198.8675055 * T) * D;
    const F = (93.272095 + 483202.0175233 * T) * D;
    const lon = Lp + 6.289 * Math.sin(Mp) - 1.274 * Math.sin(2 * Dm - Mp) + 0.658 * Math.sin(2 * Dm)
      + 0.214 * Math.sin(2 * Mp) - 0.186 * Math.sin(M) - 0.114 * Math.sin(2 * F)
      + 0.059 * Math.sin(2 * Dm - 2 * Mp) + 0.057 * Math.sin(2 * Dm - M - Mp) + 0.053 * Math.sin(2 * Dm + Mp);
    const lat = 5.128 * Math.sin(F) + 0.281 * Math.sin(Mp + F) + 0.278 * Math.sin(Mp - F)
      + 0.173 * Math.sin(2 * Dm - F);
    const dist = 385000.56 - 20905 * Math.cos(Mp) - 3699 * Math.cos(2 * Dm - Mp)
      - 2956 * Math.cos(2 * Dm) - 570 * Math.cos(2 * Mp);
    const eps = (23.439291 - 0.0130042 * T) * D;
    const l = lon * D, b = lat * D;
    const ra = Math.atan2(Math.sin(l) * Math.cos(eps) - Math.tan(b) * Math.sin(eps), Math.cos(l));
    const dec = Math.asin(Math.sin(b) * Math.cos(eps) + Math.cos(b) * Math.sin(eps) * Math.sin(l));
    return { ra: norm360(ra * RD), dec: dec * RD, distKm: dist };
  },

  moonTopocentric(jd, latDeg, lonDeg, elevM) {
    const m = Sky.moonPosition(jd);
    const s = Sky.sunPosition(jd);
    // parallax, Meeus 40.6, spherical earth and no elevation term in the stub
    const sinPi = 6378.14 / m.distKm;
    const rc = Math.cos(latDeg * D), rs = Math.sin(latDeg * D);
    const H = (Sky.lmst(jd, lonDeg) - m.ra) * D;
    const dec = m.dec * D;
    const dRa = Math.atan2(-rc * sinPi * Math.sin(H), Math.cos(dec) - rc * sinPi * Math.cos(H));
    const decT = Math.atan2((Math.sin(dec) - rs * sinPi) * Math.cos(dRa), Math.cos(dec) - rc * sinPi * Math.cos(H));
    // illumination and bright limb, Meeus 48
    const dra = (s.ra - m.ra) * D, sd = s.dec * D, md = m.dec * D;
    const psi = Math.acos(Math.sin(sd) * Math.sin(md) + Math.cos(sd) * Math.cos(md) * Math.cos(dra));
    const i = Math.atan2(s.distKm * Math.sin(psi), m.distKm - s.distKm * Math.cos(psi));
    const chi = Math.atan2(Math.cos(sd) * Math.sin(dra),
      Math.sin(sd) * Math.cos(md) - Math.cos(sd) * Math.sin(md) * Math.cos(dra));
    return {
      ra: norm360(m.ra + dRa * RD), dec: decT * RD, distKm: m.distKm,
      illum: (1 + Math.cos(i)) / 2, limbAngle: norm360(chi * RD)
    };
  },

  // Meeus ch.14: the angle at the body between the celestial pole and the zenith
  parallacticAngle(raDeg, decDeg, lmstDeg, latDeg) {
    const H = (lmstDeg - raDeg) * D, d = decDeg * D, p = latDeg * D;
    return Math.atan2(Math.sin(H), Math.tan(p) * Math.cos(d) - Math.sin(d) * Math.cos(H)) * RD;
  },

  equatorialToHorizontal(ra, dec, lmstDeg, latDeg) {
    const H = (lmstDeg - ra) * D, d = dec * D, p = latDeg * D;
    const alt = Math.asin(Math.sin(p) * Math.sin(d) + Math.cos(p) * Math.cos(d) * Math.cos(H));
    const az = Math.atan2(Math.sin(H), Math.cos(H) * Math.sin(p) - Math.tan(d) * Math.cos(p));
    return { alt: alt * RD, az: norm360(az * RD + 180) };
  },

  refract(altDeg) {
    if (altDeg < -2) return altDeg;
    return altDeg + (1 / Math.tan((altDeg + 7.31 / (altDeg + 4.4)) * D)) / 60;
  },

  precess(ra, dec, fromJd, toJd) {
    const T = (fromJd - 2451545) / 36525, t = (toJd - fromJd) / 36525;
    const z1 = ((2306.2181 + 1.39656 * T) * t + 0.30188 * t * t) / 3600 * D;
    const z2 = ((2306.2181 + 1.39656 * T) * t + 1.09468 * t * t) / 3600 * D;
    const th = ((2004.3109 - 0.8533 * T) * t - 0.42665 * t * t) / 3600 * D;
    const a = ra * D + z1, d = dec * D;
    const A = Math.cos(d) * Math.sin(a);
    const B = Math.cos(th) * Math.cos(d) * Math.cos(a) - Math.sin(th) * Math.sin(d);
    const C = Math.sin(th) * Math.cos(d) * Math.cos(a) + Math.cos(th) * Math.sin(d);
    return { ra: norm360((Math.atan2(A, B) + z2) * RD), dec: Math.asin(C) * RD };
  },

  galacticToEquatorial(l, b) {
    const raG = 192.85948 * D, decG = 27.12825 * D, lNCP = 122.93192 * D;
    const lr = l * D, br = b * D;
    const dec = Math.asin(Math.sin(br) * Math.sin(decG) + Math.cos(br) * Math.cos(decG) * Math.cos(lNCP - lr));
    const ra = raG + Math.atan2(Math.cos(br) * Math.sin(lNCP - lr),
      Math.sin(br) * Math.cos(decG) - Math.cos(br) * Math.sin(decG) * Math.cos(lNCP - lr));
    return { ra: norm360(ra * RD), dec: dec * RD };
  }
};

// stand-in catalogue, in the shipping shape: [ra, dec, mag] with a name only
// where there is one. the bright ones are by hand so the sky has recognisable
// anchors, the rest are scattered with a concentration along the galactic
// plane. padded to 1052 because that is the real catalogue's size and star
// density is the thing being judged here.
const STARS = [
  [101.29, -16.72, -1.46, 'sirius'],
  [213.92, 19.18, -0.05, 'arcturus'],
  [279.23, 38.78, 0.03, 'vega'],
  [79.17, 46.00, 0.08, 'capella'],
  [78.63, -8.20, 0.18, 'rigel'],
  [114.83, 5.22, 0.40, 'procyon'],
  [88.79, 7.41, 0.50, 'betelgeuse'],
  [297.70, 8.87, 0.76, 'altair'],
  [68.98, 16.51, 0.87, 'aldebaran'],
  [201.30, -11.16, 0.98, 'spica'],
  [247.35, -26.43, 1.06, 'antares'],
  [116.33, 28.03, 1.16, 'pollux'],
  [344.41, -29.62, 1.17, 'fomalhaut'],
  [310.36, 45.28, 1.25, 'deneb'],
  [152.09, 11.97, 1.36, 'regulus'],
  [113.65, 31.89, 1.58, 'castor'],
  [84.05, -1.20, 1.69, 'alnilam'],
  [81.28, -1.94, 2.23, 'mintaka'],
  [85.19, -1.94, 1.77, 'alnitak'],
  [86.94, -9.67, 2.07, 'saiph'],
  [81.12, 6.35, 1.64, 'bellatrix'],
  [37.95, 89.26, 1.98, 'polaris'],
  [165.93, 61.75, 1.79, 'dubhe'],
  [165.46, 56.38, 2.37, 'merak'],
  [178.46, 53.69, 2.44, 'phecda'],
  [183.86, 57.03, 3.31, 'megrez'],
  [193.51, 55.96, 1.76, 'alioth'],
  [200.98, 54.93, 2.23, 'mizar'],
  [206.89, 49.31, 1.77, 'alkaid'],
  [276.04, -34.38, 1.85, 'kaus australis'],
  [263.40, -37.10, 1.63, 'shaula'],
  [326.05, 28.08, 2.44, 'enif'],
  [10.90, 56.54, 2.23, 'schedar'],
  [14.18, 60.72, 2.27, 'caph'],
  [21.45, 60.24, 2.47, 'gamma cas'],
  [28.60, 63.67, 2.68, 'ruchbah'],
  [2.10, 29.09, 2.06, 'alpheratz'],
  [51.08, 49.86, 1.79, 'mirfak'],
  [141.90, -8.66, 1.98, 'alphard'],
  [233.67, 26.71, 2.22, 'alphecca'],
  [186.65, 28.27, 2.14, 'denebola'],
  [146.46, 23.77, 2.37, 'algieba'],
  [177.26, 14.57, 3.32, 'zosma'],
  [283.82, 32.69, 2.99, 'sheliak'],
  [292.68, 27.96, 3.24, 'albireo'],
  [305.56, 40.26, 2.46, 'sadr'],
  [311.55, 33.97, 2.87, 'gienah cygni']
];
const CONSTELLATION_LINES = [
  [22, 23, 24, 25, 26, 27, 28],           // the plough
  [20, 17, 16, 18, 4, 19, 6, 20],         // orion, roughly
  [32, 33, 34, 35],                       // cassiopeia
  [13, 45, 44, 46]                        // the cross of cygnus
];
(function fillSky() {
  let seed = 20260916;
  const rnd = () => (seed = (seed * 1103515245 + 12345) % 2147483648) / 2147483648;
  while (STARS.length < 1052) {
    const i = STARS.length;
    let ra, dec;
    if (i % 5 < 2) {                      // the plane gets its crowd
      const e = Sky.galacticToEquatorial(rnd() * 360, (rnd() - 0.5) * 26);
      ra = e.ra; dec = e.dec;
    } else {
      ra = rnd() * 360;
      dec = Math.asin(rnd() * 2 - 1) * RD;
    }
    // most to 4.5, a tail of figure-only faint ones past it
    const mag = i > 925 ? 4.5 + rnd() * 1.2 : 2.4 + rnd() * 2.1;
    STARS.push([+ra.toFixed(2), +dec.toFixed(2), +mag.toFixed(2)]);
  }
})();

// the generated horizons block declares these, so sky-panorama.js does not
const HORIZON_ALT_MIN = -10;
const HORIZON_ALT_RANGE = 90;

// an invented ridgeline for a gap on the blue ridge: high wall to the north
// and northwest, a shoulder southeast, the valley open to the southwest.
function syntheticHorizon(phase) {
  const s = [];
  for (let a = 0; a < 360; a++) {
    const r = a * Math.PI / 180;
    let v = 4.6
      + 3.4 * Math.cos(r - 0.4 + phase)
      + 1.9 * Math.cos(2 * r + 1.1 + phase)
      + 1.1 * Math.cos(3 * r - 0.8)
      + 0.55 * Math.cos(7 * r + 2.2)
      + 0.3 * Math.cos(13 * r + phase)
      + 0.16 * Math.cos(29 * r);
    v += 5.2 * Math.exp(-Math.pow(((a - 330 + 540) % 360 - 180) / 13, 2));   // a peak nw
    v += 3.1 * Math.exp(-Math.pow(((a - 118 + 540) % 360 - 180) / 9, 2));    // a knob esE
    v -= 3.2 * Math.exp(-Math.pow(((a - 232 + 540) % 360 - 180) / 22, 2));   // the valley sw
    // a wavy floor rather than a flat clamp: a straight bottom edge reads as a
    // rendering bug when you are looking for rendering bugs
    s.push(Math.max(0.35 + 0.3 * Math.cos(11 * r), v));
  }
  return s;
}

const B64ENC = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/';
function encodeHorizon(degs) {
  return degs.map(function (d) {
    const v = Math.round((d - HORIZON_ALT_MIN) * 4095 / HORIZON_ALT_RANGE);
    const c = Math.max(0, Math.min(4095, v));
    return B64ENC[Math.floor(c / 64)] + B64ENC[c % 64];
  }).join('');
}
</script>

<!-- the file under test, verbatim -->
<script src="sky-panorama.js"></script>

<script>
// ---------- decoder unit check ----------
const step = HORIZON_ALT_RANGE / 4095;
const truth = syntheticHorizon(0);
const encoded = encodeHorizon(truth);
const decoded = decodeHorizon(encoded);
let worst = 0;
for (let i = 0; i < 360; i++) worst = Math.max(worst, Math.abs(decoded[i] - truth[i]));
const lines = [
  'encoded length ' + encoded.length + ' chars (expect 720)',
  'round trip worst error ' + worst.toFixed(5) + ' deg (one quantisation step is ' + step.toFixed(5) + ')',
  'first sample ' + decoded[0].toFixed(3) + ' deg, azimuth 0; ridge peak ' + Math.max.apply(null, Array.from(decoded)).toFixed(2) + ' deg',
  'clamp ends: "AA" -> ' + decodeHorizon('AA'.repeat(360))[0].toFixed(2) + ', "//" -> ' + decodeHorizon('//'.repeat(360))[0].toFixed(2) + ' (expect -10 and 80)'
];
// the lit limb has to point at the sun. this is the check that catches a wrong
// sign in the parallactic angle, which is otherwise only visible as a moon lit
// from the wrong side on a night nobody is checking.
(function limbCheck() {
  const when = new Date(2026, 8, 16, 21, 0, 0);
  const jd = Sky.julianDay(when), lmst = Sky.lmst(jd, -83.14);
  const m = Sky.moonTopocentric(jd, 35.45, -83.14, 1830);
  const mh = Sky.equatorialToHorizontal(m.ra, m.dec, lmst, 35.45);
  const s = Sky.sunPosition(jd);
  const sh = Sky.equatorialToHorizontal(s.ra, s.dec, lmst, 35.45);
  const q = Sky.parallacticAngle(m.ra, m.dec, lmst, 35.45);
  const w = 1100, h = 300;                       // the drawn canvas, near enough
  const drawn = -(90 + (m.limbAngle - q)) * D;   // what drawMoon rotates by
  let daz = sh.az - mh.az;
  while (daz > 180) daz -= 360;
  while (daz < -180) daz += 360;
  const toSun = Math.atan2((mh.alt - sh.alt) * h / 90, daz * w / 360);
  let diff = (drawn - toSun) * RD;
  while (diff > 180) diff -= 360;
  while (diff < -180) diff += 360;
  lines.push('lit limb points ' + Math.abs(diff).toFixed(0) + ' deg off the sun'
    + ' (moon alt ' + mh.alt.toFixed(1) + ', sun alt ' + sh.alt.toFixed(1)
    + ', illum ' + (m.illum * 100).toFixed(0) + '%, parallactic ' + q.toFixed(0) + ' deg)');
  lines.push('stars ' + STARS.length + ', figure runs ' + CONSTELLATION_LINES.length);
})();

const ok = encoded.length === 720 && worst <= step && Math.abs(decodeHorizon('AA'.repeat(360))[0] + 10) < 1e-9;
const check = document.getElementById('check');
check.textContent = (ok ? 'decoder ok\n' : 'DECODER FAILED\n') + lines.join('\n');
if (!ok) check.className = 'check bad';

// ---------- render ----------
const spot = { horizon: decoded, lat: 35.45, lon: -83.14, elevM: 1830 };
const at = h => new Date(2026, 8, 16, h, 0, 0);

function render(canvasId, sumId, date, az0) {
  const c = document.getElementById(canvasId);
  drawPanorama(c, Object.assign({ date: date, mode: 'full', az0: az0 }, spot));
  if (sumId) document.getElementById(sumId).innerHTML = '<b>' + horizonSummary(Object.assign({ date: date }, spot)) + '</b>';
}
// north-centred, on purpose: azimuth 0 then sits in the middle of the canvas
// rather than at either edge, which is where the wrap actually needs checking
// now that the open view is a window rather than a full turn (see seamCheck).
render('pano-9', 'sum-9', at(21), 0);

// the wrap seam. north-centred, azimuth 359.9 and azimuth 0.1 are a third of a
// degree apart in reality and a third of the canvas apart in azToX's raw,
// unwrapped x -- they meet at the centre column here, not at the two edges,
// which is where they met back when the open view was a full turn. a milky
// way band smeared across the centre instead of wrapping shows up here as a
// large difference long before it is obvious to the eye.
(function seamCheck() {
  const c = document.getElementById('pano-9');
  const g = c.getContext('2d');
  const mid = Math.round(c.width / 2);
  const left = g.getImageData(mid - 2, 0, 2, c.height).data;
  const right = g.getImageData(mid, 0, 2, c.height).data;
  let sum = 0;
  for (let i = 0; i < left.length; i++) sum += Math.abs(left[i] - right[i]);
  const mean = sum / left.length;
  const el = document.createElement('div');
  el.textContent = 'wrap seam: mean centre-column difference ' + mean.toFixed(1) + ' of 255'
    + (mean < 12 ? ' (continuous)' : ' (SEAM, the band is not wrapping)');
  document.getElementById('check').appendChild(el);
})();
render('pano-1', 'sum-1', new Date(2026, 8, 17, 1, 0, 0));
render('pano-phone', 'sum-phone', at(21));

const CARDS = [
  { name: 'waterrock knob', dist: '41 min', phase: 0, note: 'parkway overlook at 5,820 ft, wall of ridge to the northwest' },
  { name: 'black balsam', dist: '55 min', phase: 1.7, note: 'open bald, the whole southern sky is yours' },
  { name: 'max patch', dist: '1 hr 12', phase: 3.3, note: 'grassy summit, low horizon in every direction but north' }
];
document.getElementById('cards').innerHTML = CARDS.map(function (s, i) {
  return '<div class="spot"><div class="top"><span class="name">' + s.name + '</span>'
    + '<span class="dist">' + s.dist + '</span></div>'
    + '<canvas id="thumb' + i + '"></canvas>'
    + '<div class="note">' + s.note + '</div></div>';
}).join('');
CARDS.forEach(function (s, i) {
  drawPanorama(document.getElementById('thumb' + i), {
    horizon: decodeHorizon(encodeHorizon(syntheticHorizon(s.phase))), mode: 'thumb'
  });
});
</script>
</body>
</html>
